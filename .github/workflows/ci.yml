name: Continuous Integration

on:
  push:
    branches:
      - main
      - preview
  pull_request:
    branches:
      - main
      - preview
  schedule:
    - cron: '0 9 * * 1'

jobs:
  nextjs:
    name: Next.js Tests, Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm test

      - name: Build
        run: npm run build
